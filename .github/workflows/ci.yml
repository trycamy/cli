name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly: catch installer drift even with no commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Installer lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # scripts/install.sh is what `curl | sh` executes on a stranger's
      # machine. Check it under plain sh, dash (Debian's /bin/sh, stricter
      # than bash), and shellcheck.
      - name: Lint
        run: |
          set -euo pipefail
          if ! command -v dash >/dev/null || ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            command -v dash >/dev/null || sudo apt-get install -y -qq dash
            command -v shellcheck >/dev/null || sudo apt-get install -y -qq shellcheck
          fi
          sh -n scripts/install.sh
          sh -n scripts/install_test.sh
          dash -n scripts/install.sh
          dash -n scripts/install_test.sh
          shellcheck -s sh scripts/install.sh scripts/install_test.sh

      # End-to-end against a fake release channel served on 127.0.0.1:
      # checksum verification, atomic same-directory rename, version-shape
      # gate, PATH wiring. No real network egress.
      - name: Test
        run: sh scripts/install_test.sh

  drift:
    name: Installer matches the release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The installer people actually run is served from dl.camy.sh. This
      # repo mirrors it so it can be read and reviewed; the two must never
      # silently differ. Publish to the channel first, then update the mirror.
      - name: Diff against https://dl.camy.sh/install
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --proto '=https' --tlsv1.2 \
            https://dl.camy.sh/install -o "$RUNNER_TEMP/live-install.sh"
          diff -u "$RUNNER_TEMP/live-install.sh" scripts/install.sh

  # The merged index is unsigned; the per-version manifests are signed.
  # Nothing else compares them, so this read-only job does, on every push
  # and weekly: every line of the merged index must appear verbatim in the
  # signed manifest of its version, and every version in the index must have
  # one. (A manifest may list more than the index does: a withdrawn file is
  # dropped from the index, never from the signed manifest.) A line that
  # disagrees means the channel changed outside a release.
  index:
    name: Channel index matches the signed manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare stable/SHA256SUMS with every SHA256SUMS-<version>
        run: |
          set -euo pipefail
          C=https://dl.camy.sh/stable
          get() { curl -fsSL --retry 3 --retry-delay 2 --proto '=https' --tlsv1.2 "$@"; }
          get "$C/SHA256SUMS" | grep -v '^#' > index
          bad=0
          for v in $(awk '{print $2}' index | sed -nE 's/^camy_([0-9][^_]*)_.*/\1/p' | sort -uV); do
            if ! get "$C/SHA256SUMS-$v" -o "manifest-$v"; then echo "::error::no signed manifest for $v on the channel"; bad=1; continue; fi
            grep -v '^#' "manifest-$v" > "signed-$v"
            while read -r line; do
              grep -qxF "$line" "signed-$v" || { echo "::error::index line not in SHA256SUMS-$v: $line"; bad=1; }
            done < <(grep "_${v}_" index)
          done
          [ "$bad" = 0 ] && echo "index matches every signed manifest"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Relative links resolve
        run: python3 scripts/check-docs.py
