name: Mirror release

# camy is built, signed, and published to the release channel
# (https://dl.camy.sh/stable/) by a private pipeline. This workflow turns each
# published version into a GitHub Release here, with the same assets, after
# verifying them: every tarball against the version-scoped SHA256SUMS, and
# that manifest against its cosign signature with the signing workflow's
# identity pinned (the same check docs/verifying-releases.md shows). It runs
# with this repository's own token and uploads nothing it could not verify.
# Release notes come from CHANGELOG.md; a version whose heading still says
# "unreleased" is skipped until the notes and the date are written.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to mirror (default: the channel's current VERSION)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mirror-release
  cancel-in-progress: false

env:
  CHANNEL: https://dl.camy.sh/stable
  # The workflow that signs releases lives in the private source repository.
  SIGNER: '^https://github\.com/CamyAI/camy-cli/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
  # The source repository the SLSA provenance must name, for slsa-verifier.
  SOURCE: github.com/CamyAI/camy-cli

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.v.outputs.version }}
      released: ${{ steps.v.outputs.skip == 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          v="${INPUT:-$(curl -fsSL --retry 3 --proto '=https' --tlsv1.2 "$CHANNEL/VERSION" | tr -cd '0-9A-Za-z.-')}"
          case "$v" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::unexpected VERSION '$v'"; exit 1 ;; esac
          echo "skip=true" >> "$GITHUB_OUTPUT"
          heading=$(grep -E "^## ${v//./\\.}( |$)" CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "::notice::$v has no CHANGELOG.md section, so it is not a public release; nothing to do"; exit 0
          fi
          case "$heading" in
            *nreleased*) echo "::notice::CHANGELOG.md still marks $v unreleased; write the notes and the date, then re-run"; exit 0 ;;
          esac
          if gh release view "v$v" >/dev/null 2>&1; then echo "::notice::v$v is already released"; exit 0; fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.v.outputs.skip == 'false'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install slsa-verifier
        if: steps.v.outputs.skip == 'false'
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Download and verify
        if: steps.v.outputs.skip == 'false'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          get() { curl -fsSL --retry 3 --retry-delay 2 --proto '=https' --tlsv1.2 -O "$CHANNEL/$1"; }
          get "SHA256SUMS-$V"; get "SHA256SUMS-$V.sig"; get "SHA256SUMS-$V.pem"
          get "SHA256SUMS-$V.minisig" || { echo "::error::no minisign signature published for $V"; exit 1; }
          cosign verify-blob \
            --certificate "SHA256SUMS-$V.pem" --signature "SHA256SUMS-$V.sig" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "$SIGNER" \
            "SHA256SUMS-$V"
          # Every file that lands on the GitHub Release is checked against the
          # cosign-verified manifest: the tarballs and their SBOMs by hash here.
          check() {
            want=$(awk -v f="$1" '($2 == f || $2 == "*" f) { print $1; exit }' "SHA256SUMS-$V")
            got=$(sha256sum "$1" | cut -d' ' -f1)
            if [ -z "$want" ] || [ "$want" != "$got" ]; then echo "::error::$1 does not match SHA256SUMS-$V"; exit 1; fi
          }
          for p in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            t="camy_${V}_${p}.tar.gz"
            get "$t"; check "$t"
            get "$t.sbom.cdx.json"; check "$t.sbom.cdx.json"
          done
          # SLSA build provenance is mandatory from 1.0.1 on; only 1.0.0
          # predates it. It must verify for every tarball: the provenance names
          # the source repository, the tag, and the builder.
          if [ "$V" = "1.0.0" ]; then
            echo "::notice::$V predates SLSA provenance"
          else
            get "camy_$V.intoto.jsonl" || { echo "::error::no SLSA provenance published for $V; refusing to mirror"; exit 1; }
            for p in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
              slsa-verifier verify-artifact "camy_${V}_${p}.tar.gz" \
                --provenance-path "camy_$V.intoto.jsonl" \
                --source-uri "$SOURCE" --source-tag "v$V"
            done
          fi
          ls -la

      # The npm job builds from these exact bytes, not from a second download.
      - name: Keep the verified assets for the npm job
        if: steps.v.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-${{ steps.v.outputs.version }}
          path: assets/
          retention-days: 1

      - name: Release notes from CHANGELOG.md
        if: steps.v.outputs.skip == 'false'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$V" '/^## / { if (on) exit; on = ($2 == v); next } on { print }' CHANGELOG.md \
            | sed -e '1{/^$/d;}' > notes.md
          [ -s notes.md ] || { echo "::error::empty CHANGELOG.md section for $V"; exit 1; }
          printf '\n---\n\nEvery asset was downloaded from the release channel and verified before upload: checksums against `SHA256SUMS-%s`, that manifest against its cosign signature, and, where published, each tarball against the SLSA provenance `camy_%s.intoto.jsonl`. See docs/verifying-releases.md.\n' "$V" "$V" >> notes.md
          cat notes.md

      - name: Create the GitHub Release
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md --latest assets/*
          echo "::notice::released v$V with $(ls assets | wc -l) assets"

  # The npm packages: an @camy/cli launcher plus one platform package per os/arch
  # carrying the binary, assembled from the channel's verified tarballs
  # (scripts/build-npm.sh) and published with npm trusted publishing, so the
  # credential is this workflow's identity and every publish carries
  # provenance. Enabled by the repository variable NPM_PUBLISH=true once the
  # packages exist on npmjs.com with this workflow as their trusted publisher.
  npm:
    needs: mirror
    if: needs.mirror.outputs.released == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5 or later. Pinned exactly, with
      # lifecycle scripts off: this step runs while the job holds the publish
      # identity.
      - name: Update npm
        run: npm install -g --ignore-scripts npm@11.5.2

      - name: Fetch the assets the mirror job verified
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assets-${{ needs.mirror.outputs.version }}
          path: assets/

      - name: Build the packages from the verified assets
        env:
          V: ${{ needs.mirror.outputs.version }}
        run: sh scripts/build-npm.sh "$V" "$GITHUB_WORKSPACE/assets"

      - name: Publish
        run: sh scripts/publish-npm.sh --provenance
