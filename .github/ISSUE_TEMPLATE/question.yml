name: Question
description: How do I do something with camy?
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        The [documentation](../blob/main/docs/README.md) and `camy <command> --help` answer most of these. If they don't, ask here and the answer usually becomes a doc fix too.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: The goal in your own words, and what you tried.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: camy version --json
